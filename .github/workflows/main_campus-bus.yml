name: Build and deploy Node.js app to Azure Web App - Campus-bus

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build application
        working-directory: backend
        run: npm run build --if-present

      - name: Run tests
        working-directory: backend
        run: npm run test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0F80B65E5A6F4D9994F620A8EECD08B8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2A044D6797F4F529BD0CB6B76C9C615 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_57E5C811E111400180C481E7F1704786 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Campus-bus'
          slot-name: 'Production'
          package: .
